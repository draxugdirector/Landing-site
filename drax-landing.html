<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drax UG – Here To Help You</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #D4A843;
    --gold-light: #F5D27A;
    --gold-dark: #8A6A1A;
    --black: #0A0A0A;
    --surface: #141414;
    --surface2: #1E1E1E;
    --text: #F5F0E8;
    --muted: #9A9080;
    --green-wa: #25D366;
  }

  html, body {
    min-height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.6;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem 4rem;
    position: relative;
  }

  .page::after {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 500px;
    background: radial-gradient(ellipse at 50% 30%, rgba(212,168,67,0.18) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid rgba(212,168,67,0.25);
    border-radius: 24px;
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,168,67,0.08);
    animation: rise 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(32px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
  }

  .photo-wrap {
    position: relative;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 240px;
    overflow: hidden;
  }

  .photo-placeholder {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a2318, #3d3120);
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .photo-placeholder svg {
    width: 60px; height: 60px;
    opacity: 0.5;
    fill: var(--gold);
  }

  .photo-label {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
    background: var(--surface);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(212,168,67,0.2);
  }

  .photo-wrap::before, .photo-wrap::after {
    content: '';
    position: absolute;
    width: 40px; height: 40px;
    border-color: rgba(212,168,67,0.35);
    border-style: solid;
  }
  .photo-wrap::before { top: 14px; left: 14px; border-width: 2px 0 0 2px; }
  .photo-wrap::after  { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; }

  .body {
    padding: 1.75rem 1.75rem 2rem;
    text-align: center;
    border-top: 1px solid rgba(212,168,67,0.12);
  }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(212,168,67,0.1);
    border: 1px solid rgba(212,168,67,0.3);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 1rem;
    animation: fadein 0.6s 0.3s both;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.9rem, 7vw, 2.7rem);
    letter-spacing: 0.03em;
    line-height: 1.05;
    color: var(--text);
    margin-bottom: 0.5rem;
    animation: fadein 0.6s 0.45s both;
  }

  h1 span { color: var(--gold-light); }

  .tagline {
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 1.5rem;
    animation: fadein 0.6s 0.55s both;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
    animation: fadein 0.6s 0.6s both;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(212,168,67,0.2);
  }
  .divider span {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ── PAYMENT FORM STYLES ── */
  .pay-form-wrap {
    background: rgba(212,168,67,0.06);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 16px;
    padding: 1.25rem 1.25rem 1rem;
    margin-bottom: 0.75rem;
    animation: fadein 0.6s 0.7s both;
  }

  .pay-form-wrap .price-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .price-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    line-height: 1;
    margin-bottom: 1rem;
  }

  /* Currency selector */
  .cur-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
    justify-content: center;
  }

  .cur-btn {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    border: 1px solid rgba(212,168,67,0.25);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .cur-btn.active, .cur-btn:hover {
    background: rgba(212,168,67,0.15);
    border-color: var(--gold);
    color: var(--gold-light);
  }

  /* Amount display */
  .amount-row {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid rgba(212,168,67,0.2);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1rem;
  }

  .amount-cur-badge {
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    background: rgba(212,168,67,0.1);
    height: 46px;
    display: flex;
    align-items: center;
    border-right: 1px solid rgba(212,168,67,0.2);
    letter-spacing: 0.05em;
  }

  .amount-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 0 14px;
    height: 46px;
  }

  .amount-input::placeholder { color: var(--muted); }

  /* Pay button */
  .pay-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 0.95rem 1.5rem;
    background: var(--green-wa);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 4px 20px rgba(37,211,102,0.25);
  }

  .pay-btn:hover {
    background: #22c55e;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(37,211,102,0.35);
  }

  .pay-btn:active { transform: scale(0.98); }

  .pay-btn svg {
    width: 21px; height: 21px;
    fill: #fff; flex-shrink: 0;
  }

  .footer-note {
    margin-top: 1rem;
    font-size: 11.5px;
    color: var(--muted);
    animation: fadein 0.6s 0.9s both;
    line-height: 1.5;
  }

  /* Hidden real form */
  #real-form { display: none; }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    animation: float var(--dur) var(--delay) infinite ease-in-out;
    left: var(--x); bottom: -10px;
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    20%  { opacity: 0.4; }
    80%  { opacity: 0.15; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.2); }
  }
</style>
</head>
<body>

<div class="particles" aria-hidden="true" id="particles"></div>

<!-- Hidden real JPesa form that gets submitted programmatically -->
<form name="JPesa" id="real-form" method="post" action="https://my.jpesa.com/?dad=xp">
  <input type="hidden" name="ownerid" value="tayebwa.drake" />
  <input type="hidden" name="description" value="Drax UG WhatsApp Access" />
  <!-- IMPORTANT: Replace YOUR_WHATSAPP_NUMBER below with your actual number e.g. 256701234567 -->
  <input type="hidden" name="return" value="https://wa.me/256XXXXXXXXX?text=Hi+Drax%2C+I+have+paid+for+access%21" />
  <input type="hidden" name="cancel" value="" id="cancel-url" />
  <input type="hidden" name="cur" id="real-cur" value="UGX" />
  <input type="hidden" name="amount" id="real-amount" value="1000" />
</form>

<main class="page">
  <div class="card">
    <div class="photo-wrap">
      <div class="photo-placeholder">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="22" r="12"/>
          <path d="M8 56c0-13.3 10.7-24 24-24s24 10.7 24 24"/>
        </svg>
      </div>
      <span class="photo-label">Drax UG</span>
    </div>

    <div class="body">
      <div class="badge">Available Now</div>

      <h1>I Am <span>Drax UG</span><br>Here To Help You</h1>

      <p class="tagline">Pay once · Get instant access to my<br>WhatsApp inbox for direct help.</p>

      <div class="divider"><span>Complete Payment</span></div>

      <div class="pay-form-wrap">
        <p class="price-label">Access fee</p>
        <div class="price-big" id="price-display">1,000 UGX</div>

        <!-- Currency selector -->
        <div class="cur-row">
          <button type="button" class="cur-btn active" data-cur="UGX" onclick="setCur('UGX',1000,this)">UGX</button>
          <button type="button" class="cur-btn" data-cur="KES" onclick="setCur('KES',30,this)">KES</button>
          <button type="button" class="cur-btn" data-cur="USD" onclick="setCur('USD',0.27,this)">USD</button>
        </div>

        <!-- Amount field -->
        <div class="amount-row">
          <span class="amount-cur-badge" id="cur-badge">UGX</span>
          <input class="amount-input" type="number" id="amount-field" value="1000" min="1" placeholder="Enter amount" />
        </div>

        <!-- Pay button -->
        <button type="button" class="pay-btn" onclick="submitPayment()">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Pay &amp; Open WhatsApp
        </button>
      </div>

      <p class="footer-note">🔒 Powered by JPesa · After payment you'll be sent directly to WhatsApp</p>
    </div>
  </div>
</main>

<script>
  /* ── Particles ── */
  const wrap = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.setProperty('--x', Math.random() * 100 + 'vw');
    p.style.setProperty('--dur', (8 + Math.random() * 14) + 's');
    p.style.setProperty('--delay', (Math.random() * 10) + 's');
    p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
    wrap.appendChild(p);
  }

  /* ── Currency logic ── */
  const amounts = { UGX: 1000, KES: 30, USD: 0.27 };
  let activeCur = 'UGX';

  function setCur(cur, defaultAmt, btn) {
    activeCur = cur;
    document.querySelectorAll('.cur-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('cur-badge').textContent = cur;
    document.getElementById('amount-field').value = defaultAmt;
    updatePriceDisplay(cur, defaultAmt);
  }

  function updatePriceDisplay(cur, amt) {
    const fmt = parseFloat(amt).toLocaleString(undefined, {
      minimumFractionDigits: cur === 'USD' ? 2 : 0,
      maximumFractionDigits: cur === 'USD' ? 2 : 0
    });
    document.getElementById('price-display').textContent = fmt + ' ' + cur;
  }

  document.getElementById('amount-field').addEventListener('input', function() {
    updatePriceDisplay(activeCur, this.value || 0);
  });

  /* ── Submit to JPesa ── */
  function submitPayment() {
    const amt = document.getElementById('amount-field').value.trim();
    if (!amt || parseFloat(amt) <= 0) {
      alert('Please enter a valid amount.');
      return;
    }
    document.getElementById('real-cur').value = activeCur;
    document.getElementById('real-amount').value = amt;
    document.getElementById('cancel-url').value = window.location.href;
    document.getElementById('real-form').submit();
  }
</script>
</body>
</html>
